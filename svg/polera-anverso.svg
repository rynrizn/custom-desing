<svg xmlns="http://www.w3.org/2000/svg" viewBox="-43.48 -2.56 87.01 74.51" data-vista="anverso" data-talla-base="M" data-modo="medidas-reales">
  <!-- Unidades: centímetros. Origen: x=0 centro de la polera, y=0 punto más alto del hombro. Talla M (53 x 71 cm). -->
  <defs>
    <!-- Gradiente sutil de volumen corporal en torso -->
    <linearGradient id="sombra-torso-anverso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Sombras sutiles en las uniones de sisa -->
    <linearGradient id="sombra-manga-izq" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sombra-manga-der" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <g id="polera" fill="var(--color-prenda, #ffffff)" stroke="#666666" stroke-width="0.08" stroke-linejoin="round">
    <!-- Mangas en perspectiva lateral -->
    <path id="manga-izq-vista" d="M-27.82 4.80 L-28.06 4.80 L-29.79 6.54 L-33.96 11.30 L-40.43 18.25 L-42.48 20.77 L-42.43 21.00 L-38.57 24.29 L-35.09 27.45 L-33.46 29.00 L-32.27 30.38 L-31.89 30.65 L-31.42 30.56 L-28.54 29.32 L-26.70 28.41Z"/>
    <path id="manga-der-vista" d="M28.17 4.80 L26.87 28.04 L29.36 29.42 L30.91 30.42 L31.71 30.79 L32.00 30.83 L32.66 30.51 L34.24 29.05 L40.27 23.10 L42.52 21.09 L42.52 20.77 L41.92 19.90 L34.95 12.08 L29.72 5.81 L28.69 4.80Z"/>

    <!-- Cuerpo anverso Talla M (53 x 71 cm) con ruedo y axila suavizados -->
    <path id="cuerpo" d="M25.76 3.07 L22.21 1.88 L16.24 0.14 L14.70 -0.46 L13.40 -0.78 L11.39 -1.56 L10.97 -1.51 L9.79 -0.91 L8.72 -0.50 L6.54 0.09 L3.40 0.50 L0.62 0.64 L-2.45 0.55 L-5.65 0.14 L-8.43 -0.55 L-10.44 -1.37 L-11.09 -1.51 L-12.92 -0.78 L-14.23 -0.46 L-16.47 0.37 L-24.05 2.56 L-25.94 3.39 L-28.01 4.67 L-28.01 4.76 L-27.71 4.85 L-26.50 28.40 L-26.50 32.00 L-26.50 36.83 L-26.50 40.58 L-26.50 48.95 L-26.55 55.35 L-26.55 68.07 L-26.50 70.80 Q0 71.20 26.50 70.80 L26.55 68.07 L26.55 55.35 L26.50 48.95 L26.50 36.83 L26.50 32.00 L26.50 28.00 L28.07 4.85 L28.19 4.76 L28.66 4.76 L28.66 4.67 L27.48 3.93Z"/>
    
    <!-- Volumen sobre el torso -->
    <path d="M25.76 3.07 L22.21 1.88 L16.24 0.14 L14.70 -0.46 L13.40 -0.78 L11.39 -1.56 L10.97 -1.51 L9.79 -0.91 L8.72 -0.50 L6.54 0.09 L3.40 0.50 L0.62 0.64 L-2.45 0.55 L-5.65 0.14 L-8.43 -0.55 L-10.44 -1.37 L-11.09 -1.51 L-12.92 -0.78 L-14.23 -0.46 L-16.47 0.37 L-24.05 2.56 L-25.94 3.39 L-28.01 4.67 L-28.01 4.76 L-27.71 4.85 L-26.50 28.40 L-26.50 32.00 L-26.50 36.83 L-26.50 40.58 L-26.50 48.95 L-26.55 55.35 L-26.55 68.07 L-26.50 70.80 Q0 71.20 26.50 70.80 L26.55 68.07 L26.55 55.35 L26.50 48.95 L26.50 36.83 L26.50 32.00 L26.50 28.00 L28.07 4.85 L28.19 4.76 L28.66 4.76 L28.66 4.67 L27.48 3.93Z" fill="url(#sombra-torso-anverso)" stroke="none"/>

    <!-- Cuello acanalado banda 1.5 cm (abertura 18 cm, caída borde interior ~8 cm) -->
    <!-- Fondo interior del cuello -->
    <path id="cuello-fondo" d="M-9.0 -1.0 Q0 -2.2 9.0 -1.0 Q0 2.2 -9.0 -1.0Z" fill="rgba(0,0,0,0.14)" stroke="none"/>
    <!-- Banda acanalada -->
    <path id="cuello-banda" d="M-9.0 -1.0 Q0 8.0 9.0 -1.0 Q9.2 0.4 8.2 1.3 Q0 9.5 -8.2 1.3 Q-9.2 0.4 -9.0 -1.0Z" fill="var(--color-cuello, var(--color-prenda, #ffffff))" stroke="rgba(0,0,0,0.25)" stroke-width="0.08"/>
    <!-- Pespunte de confección en cuello -->
    <path id="cuello-pespunte" d="M-8.4 0.8 Q0 8.2 8.4 0.8" fill="none" stroke="rgba(0,0,0,0.20)" stroke-width="0.07" stroke-dasharray="0.35,0.25"/>

    <!-- Pespunte de confección en ruedo inferior -->
    <path id="ruedo-pespunte" d="M-26.3 69.4 Q0 69.8 26.3 69.4" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.07" stroke-dasharray="0.4,0.3"/>
  </g>
</svg>
