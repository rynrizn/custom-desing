    <path id="manga-izq-vista" d="M-27.56 4.55 L-27.83 4.55 L-29.30 6.00 L-34.27 11.86 L-39.52 17.68 L-41.94 20.59 L-41.93 20.73 L-41.70 21.00 L-33.87 27.91 L-32.05 29.77 L-30.02 29.77 L-26.29 27.95Z"/>
    <path id="manga-der-vista" d="M27.90 4.55 L26.57 27.68 L27.49 28.09 L27.77 28.32 L29.60 29.27 L29.92 29.59 L30.29 29.77 L32.37 29.77 L35.69 26.50 L41.99 20.59 L41.99 20.41 L39.17 17.05 L34.15 11.41 L29.64 6.05 L28.18 4.55Z"/>

