    <!-- Pespunte de confección en cuello reverso -->
    <path id="cuello-pespunte" d="M-8.4 0.7 Q0 3.6 8.4 0.7" fill="none" stroke="rgba(0,0,0,0.20)" stroke-width="0.07" stroke-dasharray="0.35,0.25"/>

